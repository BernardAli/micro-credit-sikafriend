{% load currency %}
<section class="pf-panel"><h2>{{ heading }}</h2><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>Segment</th><th>Customers / loans</th><th>Outstanding</th><th>Unpaid</th><th>Share</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.label }}</td><td>{{ row.customers }} / {{ row.loans }}</td><td class="money">{{ row.outstanding|ghs }}</td><td class="money">{{ row.arrears|ghs }}</td><td>{{ row.share }}%</td></tr>{% empty %}<tr><td colspan="5" class="pf-empty">No loans are available for this breakdown.</td></tr>{% endfor %}</tbody></table></div></section>
