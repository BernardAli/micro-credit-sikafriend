{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | SikaFriend</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#fbfafb;color:#2d2730;font-family:Arial,sans-serif}.shell{width:min(760px,100%);text-align:center}.logo{width:min(340px,78vw);height:auto;margin:0 auto 48px}.code{margin:0;color:#e60046;font:800 14px Arial,sans-serif;text-transform:uppercase}.title{margin:12px 0 0;color:#100d12;font:700 clamp(34px,7vw,64px) Georgia,serif;line-height:1.04}.copy{max-width:590px;margin:18px auto 0;color:#716873;font-size:17px;line-height:1.7}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 20px;border:1px solid #e60046;border-radius:8px;color:#e60046;font-weight:800;text-decoration:none}.btn.primary{background:#e60046;color:#fff}.rule{width:56px;height:3px;margin:26px auto 0;background:#c6009f;border-radius:3px}@media(max-width:520px){.logo{margin-bottom:34px}.actions{display:grid}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <img class="logo" src="{% static 'website/images/sikafriend-logo.webp' %}" alt="SikaFriend Micro-Credit Enterprise">
    <p class="code">Error 404</p>
    <h1 class="title">This page could not be found</h1>
    <div class="rule"></div>
    <p class="copy">The address may be incorrect, the page may have moved, or your account may not have access to it.</p>
    <div class="actions">
      <a class="btn primary" href="/">Return to Website</a>
      <a class="btn" href="/redirect/">Go to Dashboard</a>
    </div>
  </main>
</body>
</html>
