name: Security and application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-database-password
          MYSQL_DATABASE: sikafriend_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-application-key-do-not-use-in-production-739215
      DB_ENGINE: ${{ matrix.database }}
      DB_NAME: sikafriend_ci
      DB_USER: root
      DB_PASSWORD: ci-only-database-password
      DB_HOST: 127.0.0.1
      LEGACY_DB_NAME: ""
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      ARKESEL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check repository and dependencies
        run: |
          python scripts/check_repository_hygiene.py
          python -m pip check
          python -m pip_audit --disable-pip --no-deps -r requirements.txt
      - name: Check application and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Check production security defaults
        run: python scripts/check_production_defaults.py
      - name: Run all tests
        run: python manage.py test --noinput
